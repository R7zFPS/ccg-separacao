<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Casa das Correntes</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #051D3A;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    svg { opacity: 0.6; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p  { font-size: 0.95rem; opacity: 0.7; margin: 0 0 2rem; }
    button {
      padding: 0.6rem 1.5rem;
      background: #1F6AAD;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: #155491; }
  </style>
</head>
<body>
  <!-- Ícone de corrente -->
  <svg viewBox="0 0 80 48" width="80" height="48" xmlns="http://www.w3.org/2000/svg">
    <rect x="2" y="4" width="38" height="40" rx="19" stroke="white" stroke-width="6" fill="none"/>
    <rect x="40" y="4" width="38" height="40" rx="19" stroke="white" stroke-width="6" fill="none"/>
    <rect x="39" y="14" width="3" height="20" fill="#051D3A"/>
  </svg>

  <h1>Sem conexão</h1>
  <p>Verifique sua internet e tente novamente.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
