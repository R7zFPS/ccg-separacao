<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 24">
  <!-- Corrente — dois anéis entrelaçados, fundo marinho -->
  <rect width="40" height="24" rx="6" fill="#092D56"/>
  <!-- Anel esquerdo -->
  <rect x="2" y="3.5" width="18" height="17" rx="8.5"
        stroke="white" stroke-width="3" fill="none"/>
  <!-- Anel direito -->
  <rect x="20" y="3.5" width="18" height="17" rx="8.5"
        stroke="white" stroke-width="3" fill="none"/>
  <!-- Sobreposição central -->
  <rect x="19.5" y="7.5" width="1.5" height="9" fill="#092D56"/>
</svg>
